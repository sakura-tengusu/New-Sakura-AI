<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「てんぐすん。」は移行しました</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        /* 全体のリセットと背景設定 */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe3e3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a3737;
            overflow: hidden;
            position: relative;
        }

        /* 桜のニュアンスを加える背景の装飾（オーナメント） */
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
        }
        body::before {
            width: 300px;
            height: 300px;
            background: rgba(255, 183, 197, 0.4);
            top: -50px;
            left: -50px;
        }
        body::after {
            width: 400px;
            height: 400px;
            background: rgba(255, 158, 181, 0.3);
            bottom: -100px;
            right: -100px;
        }

        /* 案内カードのスタイル */
        .container {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 3.5rem 2rem;
            box-shadow: 0 12px 40px rgba(255, 158, 181, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 480px;
            width: 90%;
            z-index: 1;
            box-sizing: border-box;
            transform: translateY(0);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* テキストのスタイリング */
        .message {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.8;
            margin-bottom: 2.5rem;
            letter-spacing: 0.05em;
        }

        .brand-name {
            color: #d1516e;
            font-size: 1.6rem;
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        /* 移行先ボタンのスタイリング */
        .btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #ff8da1 0%, #d1516e 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(209, 81, 110, 0.3);
            transition: all 0.3s ease;
            letter-spacing: 0.03em;
        }

        /* ボタンのホバーエフェクト */
        .btn-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(209, 81, 110, 0.45);
            background: linear-gradient(135deg, #ff9eaf 0%, #e05c7b 100%);
        }

        .btn-link:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(209, 81, 110, 0.3);
        }

        /* 補助テキスト（自動遷移用など） */
        .notice {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #8c7373;
        }

        /* ふんわり表示されるアニメーション */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <p class="message">
            <span class="brand-name">「てんぐすん。」</span>
            はこちらに移行しました。
        </p>
        
        <a href="https://tengusun.com/" class="btn-link">新しいサイトへ移動する</a>
        
        <p class="notice">ボタンをクリックすると新しいURLへ移動します。</p>
    </div>

    <script>
        // 必要に応じて、数秒後に自動でリダイレクトさせたい場合は以下のコメントアウトを解除してください。
        /*
        setTimeout(function() {
            window.location.href = "https://tengusun.com/";
        }, 5000); // 5秒後に自動遷移
        */
    </script>
</body>
</html>
